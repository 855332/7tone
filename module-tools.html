<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>趣味工具集合</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'WenQuanYi Micro Hei', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height:100vh; color:#fff; overflow-x:hidden;
    padding:40px 20px;
  }
  .module {
    max-width:900px; margin:0 auto 50px;
    background:rgba(255,255,255,.05); border-radius:24px;
    padding:40px 30px; border:1px solid rgba(255,255,255,.1);
  }
  .module + .module { margin-top:50px; }
  h2 { text-align:center; font-size:28px; margin-bottom:30px; background:linear-gradient(90deg,#f093fb,#f5576c,#fda085); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  /* 数字 */
  .num-controls { display:flex; gap:15px; justify-content:center; flex-wrap:wrap; margin-bottom:25px; }
  .num-controls label { display:flex; align-items:center; gap:8px; font-size:16px; }
  .num-controls input {
    width:100px; padding:8px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08); color:#fff; font-size:16px; text-align:center;
  }
  .btn-num {
    padding:14px 50px; font-size:18px; font-weight:700; border:none; border-radius:50px;
    cursor:pointer; color:#fff; background:linear-gradient(135deg,#f093fb,#f5576c);
    box-shadow:0 6px 25px rgba(245,87,108,.4); transition:all .3s;
  }
  .btn-num:hover:not(:disabled) { transform:scale(1.06); }
  .btn-num:disabled { opacity:.5; cursor:not-allowed; }
  .num-display {
    text-align:center; font-size:72px; font-weight:900;
    background:linear-gradient(135deg,#fbbf24,#f59e0b); -webkit-background-clip:text;
    -webkit-text-fill-color:transparent; min-height:100px; display:flex;
    align-items:center; justify-content:center;
  }
  .num-history { margin-top:20px; text-align:center; color:#94a3b8; font-size:14px; }
  .num-history span { display:inline-block; margin:4px; padding:4px 12px; background:rgba(255,255,255,.08); border-radius:8px; }

  /* 骰子 */
  .dice-controls { text-align:center; margin-bottom:25px; }
  .dice-controls label { font-size:16px; margin-right:10px; }
  .dice-controls input {
    width:80px; padding:8px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08); color:#fff; font-size:18px; text-align:center;
  }
  .btn-dice {
    display:block; margin:0 auto 30px; padding:16px 60px; font-size:20px; font-weight:800;
    border:none; border-radius:50px; cursor:pointer; color:#fff;
    background:linear-gradient(135deg,#11998e,#38ef7d);
    box-shadow:0 6px 25px rgba(56,239,125,.4); transition:all .3s;
  }
  .btn-dice:hover { transform:scale(1.06); }
  .dice-area { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; min-height:120px; }
  .die {
    width:90px; height:90px; background:rgba(255,255,255,.1); border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    font-size:48px; font-weight:900; color:#fff;
    border:2px solid rgba(255,255,255,.15);
    animation:roll .6s ease;
  }
  @keyframes roll {
    0%{transform:rotate(0) scale(1)} 50%{transform:rotate(180deg) scale(1.2)} 100%{transform:rotate(360deg) scale(1)}
  }
  .dice-total { text-align:center; margin-top:20px; font-size:22px; color:#38ef7d; font-weight:700; }

  /* 东南西北 */
  .card-pick-area { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-bottom:30px; }
  .pick-card {
    width:110px; height:160px; border-radius:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:700; color:rgba(255,255,255,.4);
    background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.12);
    transition:all .4s; position:relative; overflow:hidden;
  }
  .pick-card:hover:not(.flipped):not(.taken) { transform:translateY(-6px); border-color:rgba(255,255,255,.3); }
  .pick-card.flipped {
    background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#1a1a2e;
    border-color:#fbbf24; transform:scale(1.05); box-shadow:0 8px 30px rgba(251,191,36,.4);
    font-size:32px;
  }
  .pick-card.taken { opacity:.3; cursor:not-allowed; }
  .seat-info { text-align:center; margin-top:20px; color:#94a3b8; font-size:15px; }

  .btn-group { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
  .btn-small {
    padding:10px 28px; font-size:15px; font-weight:700; border:none; border-radius:30px;
    cursor:pointer; color:#fff; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15); transition:all .3s;
  }
  .btn-small:hover { background:rgba(255,255,255,.2); }

  /* 计分板 */
  .score-tip {
    text-align:center; color:#94a3b8; font-size:14px; margin-bottom:25px;
  }
  .score-board {
    display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:25px;
  }
  .score-card {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:18px; padding:18px 10px; text-align:center; transition:all .3s;
  }
  .score-card.winner {
    border-color:#fbbf24; box-shadow:0 0 20px rgba(251,191,36,.4);
    transform:translateY(-4px);
  }
  .score-name {
    width:100%; text-align:center; font-size:17px; font-weight:700; color:#fff;
    background:transparent; border:none; border-bottom:1px dashed rgba(255,255,255,.2);
    padding:4px 2px 8px; margin-bottom:12px; outline:none;
  }
  .score-name:focus { border-bottom-color:#f5576c; }
  .score-value {
    font-size:56px; font-weight:900; line-height:1; margin:8px 0 14px;
    background:linear-gradient(135deg,#67e8f9,#38bdf8); -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .score-btns { display:flex; justify-content:center; gap:10px; }
  .score-step {
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    font-size:22px; font-weight:700; color:#fff; line-height:1; transition:all .2s;
  }
  .score-step.plus { background:linear-gradient(135deg,#11998e,#38ef7d); }
  .score-step.minus { background:linear-gradient(135deg,#f5576c,#f093fb); }
  .score-step:hover { transform:scale(1.12); }
  .score-input-row {
    display:flex; justify-content:center; gap:8px; margin-top:12px;
  }
  .score-input-row input {
    width:70px; padding:6px; border-radius:8px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08); color:#fff; font-size:15px; text-align:center;
  }
  @media (max-width:640px) {
    .score-board { grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>

<!-- 第一部分 数字随机 -->
<div class="module" id="nums">
  <h2>🔢 数字随机抽取</h2>
  <div class="num-controls">
    <label>最小值 <input type="number" id="numMin" value="1" onchange="resetNumbers()"></label>
    <label>最大值 <input type="number" id="numMax" value="100" onchange="resetNumbers()"></label>
  </div>
  <div style="text-align:center; color:#94a3b8; font-size:14px; margin-bottom:20px;">
    区间 [<span id="rangeShow">1 - 100</span>] · 已抽取 <span id="numCount">0</span> 个
  </div>
  <div class="num-display" id="numDisplay">?</div>
  <div style="text-align:center;">
    <button class="btn-num" id="numBtn" onclick="drawNumber()">🎲 抽取数字</button>
  </div>
  <div class="num-history" id="numHistory"></div>
  <div class="btn-group">
    <button class="btn-small" onclick="resetNumbers()">🔄 重置</button>
  </div>
</div>

<!-- 第二部分 摇骰子 -->
<div class="module" id="dice">
  <h2>🎲 摇骰子</h2>
  <div class="dice-controls">
    <label>骰子数量 (1-5)</label>
    <input type="number" id="diceCount" value="2" min="1" max="5">
  </div>
  <button class="btn-dice" onclick="rollDice()">🎲 摇骰子！</button>
  <div class="dice-area" id="diceArea"></div>
  <div class="dice-total" id="diceTotal"></div>
</div>

<!-- 第三部分 东南西北 -->
<div class="module" id="seat">
  <h2>🧭 东南西北抽座位</h2>
  <div class="card-pick-area" id="seatCards"></div>
  <div class="seat-info" id="seatInfo">点击卡片翻开，每人依次抽取一个方向</div>
  <div class="btn-group">
    <button class="btn-small" onclick="initSeatCards()">🔄 重新发牌</button>
  </div>
</div>

<!-- 第四部分 计分板 -->
<div class="module" id="score">
  <h2>🏆 计分板</h2>
  <div class="score-tip">点击名字可修改（默认东南西北），± 按钮逐步计分，也可直接输入分数</div>
  <div class="score-board" id="scoreBoard"></div>
  <div class="btn-group">
    <button class="btn-small" onclick="resetScores()">🔄 清零</button>
  </div>
</div>

<script>
// ============ 数字随机 ============
let numPool = [];
let drawnNumbers = [];

function initNumbers() {
  const min = parseInt(document.getElementById('numMin').value) || 1;
  const max = parseInt(document.getElementById('numMax').value) || 100;
  numPool = [];
  for (let i = min; i <= max; i++) numPool.push(i);
  for (let i = numPool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [numPool[i], numPool[j]] = [numPool[j], numPool[i]];
  }
  drawnNumbers = [];
  updateNumDisplay();
}

function drawNumber() {
  if (numPool.length === 0) {
    initNumbers();
  }
  const num = numPool.pop();
  drawnNumbers.push(num);
  document.getElementById('numDisplay').textContent = num;
  updateNumDisplay();
}

function updateNumDisplay() {
  const min = parseInt(document.getElementById('numMin').value) || 1;
  const max = parseInt(document.getElementById('numMax').value) || 100;
  document.getElementById('rangeShow').textContent = `${min} - ${max}`;
  document.getElementById('numCount').textContent = drawnNumbers.length;
  const historyEl = document.getElementById('numHistory');
  historyEl.innerHTML = drawnNumbers.length
    ? '已抽取: ' + drawnNumbers.map(n => `<span>${n}</span>`).join('')
    : '';
  const btn = document.getElementById('numBtn');
  if (numPool.length === 0) {
    btn.textContent = '🔄 已抽完，自动重置';
  } else {
    btn.textContent = '🎲 抽取数字';
  }
}

function resetNumbers() {
  initNumbers();
  document.getElementById('numDisplay').textContent = '?';
}

initNumbers();

// ============ 摇骰子 ============
function rollDice() {
  let count = parseInt(document.getElementById('diceCount').value) || 1;
  if (count < 1) count = 1;
  if (count > 5) count = 5;
  document.getElementById('diceCount').value = count;

  const area = document.getElementById('diceArea');
  const totalEl = document.getElementById('diceTotal');
  
  let rolls = 0;
  const maxRolls = 12;
  totalEl.textContent = '🎲 摇掷中...';
  
  const animInterval = setInterval(() => {
    area.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const v = Math.floor(Math.random() * 6) + 1;
      const die = document.createElement('div');
      die.className = 'die';
      die.textContent = v;
      area.appendChild(die);
    }
    rolls++;
    if (rolls >= maxRolls) {
      clearInterval(animInterval);
      area.innerHTML = '';
      let finalSum = 0;
      for (let i = 0; i < count; i++) {
        const v = Math.floor(Math.random() * 6) + 1;
        finalSum += v;
        const die = document.createElement('div');
        die.className = 'die';
        die.textContent = v;
        area.appendChild(die);
      }
      totalEl.textContent = `🎯 总点数：${finalSum}`;
    }
  }, 60);
}

// ============ 东南西北 ============
let seatDirections = [];
let seatDrawn = [];

function initSeatCards() {
  const directions = ['东', '南', '西', '北'];
  seatDirections = [...directions];
  for (let i = seatDirections.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [seatDirections[i], seatDirections[j]] = [seatDirections[j], seatDirections[i]];
  }
  seatDrawn = [false, false, false, false];
  renderSeatCards();
  document.getElementById('seatInfo').textContent = '点击卡片翻开，每人依次抽取一个方向';
}

function renderSeatCards() {
  const container = document.getElementById('seatCards');
  container.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const card = document.createElement('div');
    card.className = 'pick-card';
    if (seatDrawn[i]) {
      card.classList.add('taken');
      card.textContent = '✓';
    } else {
      card.textContent = '？';
      card.onclick = () => flipSeatCard(i, card);
    }
    container.appendChild(card);
  }
}

function flipSeatCard(index, el) {
  if (seatDrawn[index]) return;
  seatDrawn[index] = true;
  el.classList.add('flipped');
  el.textContent = seatDirections[index];
  el.onclick = null;
  const remaining = seatDrawn.filter(Boolean).length;
  const drawnDirs = seatDirections.filter((_, i) => seatDrawn[i]);
  if (remaining === 4) {
    document.getElementById('seatInfo').textContent = `🎉 全部抽取完毕！座位顺序：${seatDirections.join(' → ')}`;
  } else {
    document.getElementById('seatInfo').textContent = `已抽取 (${remaining}/4)：${drawnDirs.join('、')}`;
  }
}

initSeatCards();

// ============ 计分板 ============
const defaultNames = ['东', '南', '西', '北'];
let scoreNames = [...defaultNames];
let scores = [0, 0, 0, 0];

function renderScoreBoard() {
  const board = document.getElementById('scoreBoard');
  board.innerHTML = '';
  const maxScore = Math.max(...scores);
  for (let i = 0; i < 4; i++) {
    const card = document.createElement('div');
    card.className = 'score-card' + (scores[i] === maxScore && scores[i] > 0 ? ' winner' : '');

    const nameInput = document.createElement('input');
    nameInput.className = 'score-name';
    nameInput.value = scoreNames[i];
    nameInput.maxLength = 8;
    nameInput.oninput = () => { scoreNames[i] = nameInput.value || defaultNames[i]; };

    const valueEl = document.createElement('div');
    valueEl.className = 'score-value';
    valueEl.textContent = scores[i];

    const btns = document.createElement('div');
    btns.className = 'score-btns';

    const minus = document.createElement('button');
    minus.className = 'score-step minus';
    minus.textContent = '−';
    minus.onclick = () => { scores[i]--; renderScoreBoard(); };

    const plus = document.createElement('button');
    plus.className = 'score-step plus';
    plus.textContent = '+';
    plus.onclick = () => { scores[i]++; renderScoreBoard(); };

    const minusLabel = document.createElement('span');
    minusLabel.className = 'score-step-label';
    minusLabel.textContent = '减';
    const plusLabel = document.createElement('span');
    plusLabel.className = 'score-step-label';
    plusLabel.textContent = '加';

    const minusWrap = document.createElement('span');
    minusWrap.appendChild(minus); minusWrap.appendChild(minusLabel);
    const plusWrap = document.createElement('span');
    plusWrap.appendChild(plus); plusWrap.appendChild(plusLabel);
    btns.appendChild(minusWrap);
    btns.appendChild(plusWrap);

    const inputRow = document.createElement('div');
    inputRow.className = 'score-input-row';
    const numInput = document.createElement('input');
    numInput.type = 'number';
    numInput.value = scores[i];
    numInput.onchange = () => {
      const v = parseInt(numInput.value);
      scores[i] = isNaN(v) ? 0 : v;
      renderScoreBoard();
    };
    const setBtn = document.createElement('button');
    setBtn.className = 'btn-small';
    setBtn.style.padding = '6px 14px';
    setBtn.style.fontSize = '13px';
    setBtn.textContent = '设置';
    setBtn.onclick = () => {
      const v = parseInt(numInput.value);
      scores[i] = isNaN(v) ? 0 : v;
      renderScoreBoard();
    };
    inputRow.appendChild(numInput);
    inputRow.appendChild(setBtn);

    card.appendChild(nameWrap(nameInput));
    card.appendChild(valueEl);
    card.appendChild(btns);
    card.appendChild(inputRow);
    board.appendChild(card);
  }
}

// 包装名字输入框，使其在卡片顶部正常显示
function nameWrap(input) {
  const wrap = document.createElement('div');
  wrap.appendChild(input);
  return wrap;
}

function resetScores() {
  scores = [0, 0, 0, 0];
  renderScoreBoard();
}

renderScoreBoard();
</script>
</body>
</html>
