<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻将趣味工具集 · 合集</title>

<!-- PWA：主题色 / 图标 / manifest -->
<meta name="theme-color" content="#0f0c29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:'WenQuanYi Micro Hei','Microsoft YaHei',sans-serif;
    background:#0f0c29;
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  /* ===== 左侧导航 ===== */
  .sidebar {
    width:180px;
    flex-shrink:0;
    background:linear-gradient(180deg,#0f0c29,#1a1a3e);
    border-right:1px solid rgba(255,255,255,.08);
    display:flex;
    flex-direction:column;
    padding:18px 0;
    z-index:100;
    box-shadow:4px 0 20px rgba(0,0,0,.4);
  }
  .sidebar .brand {
    text-align:center;
    font-size:15px;
    font-weight:900;
    color:#f1c40f;
    letter-spacing:2px;
    margin-bottom:6px;
    line-height:1.3;
  }
  .sidebar .brand small {
    display:block;
    font-size:10px;
    color:#888;
    font-weight:400;
    letter-spacing:1px;
    margin-top:2px;
  }
  .nav-divider {
    height:1px;
    background:rgba(255,255,255,.08);
    margin:10px 16px 6px;
  }
  .nav-item {
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 18px;
    margin:2px 10px;
    border-radius:12px;
    cursor:pointer;
    color:#c7c7d9;
    font-size:14px;
    font-weight:600;
    transition:all .2s;
    user-select:none;
  }
  .nav-item .ico { font-size:20px; line-height:1; }
  .nav-item .txt { flex:1; }
  .nav-item:hover { background:rgba(255,255,255,.06); color:#fff; }
  .nav-item.active {
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;
    box-shadow:0 4px 15px rgba(102,126,234,.5);
  }
  .sidebar .footer {
    margin-top:auto;
    text-align:center;
    font-size:10px;
    color:#555;
    padding:0 12px;
    line-height:1.6;
  }

  /* ===== 主内容区 ===== */
  .main {
    flex:1;
    position:relative;
    overflow:hidden;
  }
  .page {
    position:absolute;
    inset:0;
    display:none;
  }
  .page.on { display:block; }
  .page iframe {
    width:100%;
    height:100%;
    border:none;
    background:#fff;
  }

  /* 响应式：窄屏时导航收为顶部横条 */
  @media (max-width:640px) {
    body { flex-direction:column; }
    .sidebar {
      width:100%;
      flex-direction:row;
      flex-wrap:nowrap;
      overflow-x:auto;
      padding:8px 6px;
      box-shadow:0 4px 20px rgba(0,0,0,.4);
    }
    .sidebar .brand { display:none; }
    .nav-divider { display:none; }
    .sidebar .footer { display:none; }
    .nav-item {
      flex-shrink:0;
      margin:0 4px;
      padding:10px 14px;
      font-size:12px;
      white-space:nowrap;
    }
    .nav-item .ico { font-size:16px; }
  }
</style>
</head>
<body>

<!-- 左侧分页导航 -->
<div class="sidebar">
  <div class="brand">🀄 工具合集<small>MAHJONG TOOLS</small></div>
  <div class="nav-divider"></div>
  <div class="nav-item active" data-page="0"><span class="ico">🎴</span><span class="txt">技能抽取</span></div>
  <div class="nav-item" data-page="1"><span class="ico">🏆</span><span class="txt">赛季积分</span></div>
  <div class="nav-item" data-page="2"><span class="ico">🧰</span><span class="txt">工具集合</span></div>
  <div class="nav-item" data-page="3"><span class="ico">🎡</span><span class="txt">幸运转盘</span></div>
  <div class="nav-item" data-page="4"><span class="ico">🎰</span><span class="txt">摇奖系统</span></div>
  <div class="nav-item" data-page="5"><span class="ico">🀄</span><span class="txt">宝贝袈裟</span></div>
  <div class="nav-item" data-page="6"><span class="ico">🐎</span><span class="txt">麻将赛马</span></div>
  <div class="footer">每个工具在独立沙盒中运行<br>功能与原文件完全一致</div>
</div>

<!-- 主内容区：每个模块一个 iframe -->
<div class="main">
  <div class="page on"><iframe src="module-skill.html"  id="ifr0"></iframe></div>
  <div class="page">     <iframe src="season.html"         id="ifr1"></iframe></div>
  <div class="page">     <iframe src="module-tools.html"   id="ifr2"></iframe></div>
  <div class="page">     <iframe src="module-wheel.html"  id="ifr3"></iframe></div>
  <div class="page">     <iframe src="module-lottery.html" id="ifr4"></iframe></div>
  <div class="page">     <iframe src="module-jiasa.html"   id="ifr5"></iframe></div>
  <div class="page">     <iframe src="module-horse.html"   id="ifr6"></iframe></div>
</div>

<script>
  // 分页切换：切换显示对应的 iframe 页
  var navItems = document.querySelectorAll('.nav-item');
  var pages    = document.querySelectorAll('.page');

  navItems.forEach(function(item){
    item.addEventListener('click', function(){
      var idx = parseInt(item.getAttribute('data-page'));

      // 导航高亮
      navItems.forEach(function(n){ n.classList.remove('active'); });
      item.classList.add('active');

      // 页面切换
      pages.forEach(function(p, i){
        p.classList.toggle('on', i === idx);
      });
    });
  });

  // ===== PWA：注册 Service Worker（仅 https / localhost 生效）=====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js')
        .then(function (reg) {
          console.log('[SW] 注册成功:', reg.scope);
        })
        .catch(function (err) {
          console.warn('[SW] 注册失败:', err);
        });
    });
  }
</script>

</body>
</html>
